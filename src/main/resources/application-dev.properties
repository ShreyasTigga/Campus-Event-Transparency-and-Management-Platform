# MySQL Dev DB
spring.datasource.url=jdbc:mysql://campus-mysql:3306/campus_events_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Logging
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

jwt.secret=dev-secret-key-very-long-at-least-32-characters
jwt.expiration=86400000
